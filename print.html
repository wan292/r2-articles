<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handout</title>
<!--
  Print view: renders one study document as a clean A4 page for PDF export.
  Usage: print.html?slug=<slug>&doc=handout
  PDF:   chrome --headless=new --disable-gpu --no-pdf-header-footer --virtual-time-budget=10000 --print-to-pdf=out.pdf "http://localhost:8765/print.html?slug=...&doc=handout"  (Edge headless fails on this machine; see CLAUDE.md)
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 9mm 10mm 9mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #111; }
  body { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; font-size: 8.0pt; line-height: 1.26; padding: 0; }
  .sheet { max-width: 190mm; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #111; padding-bottom: 2pt; margin-bottom: 4pt; font-family: 'JetBrains Mono', monospace; font-size: 7.5pt; color: #444; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 12.5pt; line-height: 1.2; margin: 0 0 3pt; letter-spacing: -0.01em; }
  h2 { font-family: 'Fraunces', Georgia, serif; font-size: 9.6pt; margin: 5pt 0 1.8pt; padding-top: 2.2pt; border-top: 1px solid #ccc; break-after: avoid; }
  h3 { font-size: 9pt; margin: 5pt 0 1.5pt; break-after: avoid; }
  p { margin: 1.5pt 0 3.5pt; }
  ul, ol { margin: 1.5pt 0 3.5pt; padding-left: 13pt; }
  li { margin: 1pt 0; }
  li p { margin: 0; }
  table { border-collapse: collapse; width: 100%; margin: 2.5pt 0 3.5pt; font-size: 7.3pt; break-inside: auto; }
  tr { break-inside: avoid; }
  thead { display: table-header-group; }
  td:first-child { white-space: normal; min-width: 28mm; }
  th, td { border: 1px solid #bbb; padding: 1.3pt 2.6pt; text-align: left; vertical-align: top; }
  th { background: #eee; font-weight: 600; }
  tr:nth-child(even) td { background: #f7f7f7; }
  strong { font-weight: 650; }
  em { color: #333; }
  code { font-family: 'JetBrains Mono', monospace; font-size: 8.4pt; }
  blockquote { margin: 3pt 0; padding: 2pt 8pt; border-left: 2px solid #999; color: #333; }
  hr { border: none; border-top: 1px solid #ccc; margin: 6pt 0; }
  figure { margin: 4pt 0 5pt; break-inside: avoid; }
  figure img { display: block; width: 80%; height: auto; margin: 0 auto; }
  figcaption { font-size: 7.4pt; color: #555; margin-top: 2pt; }
  .foot { margin-top: 8pt; border-top: 1px solid #ccc; padding-top: 3pt; font-size: 7pt; color: #666; font-family: 'JetBrains Mono', monospace; }
  .error { color: #b00; font-weight: 600; }
  /* style=sheet: colleague-style per-paper summary sheets (purple banner per paper, emoji headings) */
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body.sheet-style { font-size: 8.05pt; line-height: 1.26; }
  body.sheet-style .top, body.sheet-style .foot { display: none; }
  .banner { background: linear-gradient(135deg, #5B2A86, #7B3FB0); color: #fff; text-align: center; padding: 7pt 12pt 6pt; border-radius: 5pt; margin: 0 0 6pt; break-before: page; }
  .banner.first { break-before: auto; }
  .banner h1 { color: #fff; font-family: 'Fraunces', Georgia, serif; font-size: 13.5pt; margin: 0; line-height: 1.2; }
  .banner p { margin: 3pt 0 0; font-size: 8.4pt; color: #EBDDF7; }
  .banner b { color: #fff; }
  body.sheet-style h2 { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 10pt; color: #3B1F5C; border-top: none; padding-top: 0; margin: 5pt 0 1.5pt; }
  body.sheet-style table { font-size: 7.15pt; margin: 2pt 0 3pt; }
  body.sheet-style ul, body.sheet-style ol { margin: 1pt 0 2.5pt; }
  body.sheet-style h3 { color: #3B1F5C; font-size: 10pt; margin: 2pt 0 2pt; }
  body.sheet-style th { background: #EFE6F7; color: #3B1F5C; }
  body.sheet-style tr:nth-child(even) td { background: #FAF7FD; }
  body.sheet-style td:first-child { min-width: 24mm; }
  .good { color: #15803D; font-weight: 700; }
  .bad { color: #C62828; font-weight: 600; }
  mark { background: #FFF176; padding: 0 1pt; }
  .connect { border: 1.5px solid #7B3FB0; background: #F7F1FC; border-radius: 6pt; padding: 3pt 9pt 2pt; margin-top: 7pt; break-inside: avoid; }
  .connect.top-box { margin: 0 0 7pt; }
  /* style=copy: a colleague's summary copied word for word into the sheet style, keeping their colours and highlights */
  body.copy-style { font-size: 9.1pt; line-height: 1.3; }
  body.copy-style h2 { font-size: 11.2pt; margin: 7pt 0 2pt; break-after: avoid; }
  body.copy-style h3 { font-size: 10.2pt; margin: 6pt 0 2pt; }
  body.copy-style p { margin: 2pt 0 5pt; }
  body.copy-style ul, body.copy-style ol { margin: 2pt 0 4pt; }
  body.copy-style li { margin: 1.5pt 0; }
  body.copy-style table { font-size: 8.9pt; margin: 3pt 0 5pt; }
  body.copy-style .banner h1 { font-size: 14pt; }
  body.copy-style .banner p { font-size: 9.6pt; }
  .k-blue { color: #0070c0; } .k-green { color: #00b050; } .k-red { color: #ff0000; } .k-blue2 { color: #4472c4; }
  .hl { background: #ffff00; padding: 0 1pt; } .hl-red { background: #ff0000; padding: 0 1pt; } .u { text-decoration: underline; }
  li.mk-green::marker { color: #00b050; } li.mk-blue::marker { color: #0070c0; } li.mk-red::marker { color: #ff0000; }
  li.mk-icon { list-style: none; } li.mk-icon::before { content: attr(data-icon); display: inline-block; width: 13pt; margin-left: -13pt; }
  .banner h1 .banner-by { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 0.82em; }
  .keep { break-inside: avoid; }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10pt; }
  .redbox { float: right; width: 44%; border: 1px solid #555; border-radius: 4pt; padding: 5pt 9pt; margin: 2pt 0 6pt 12pt; color: #d10000; font-size: 0.92em; }
  .conc-row { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14pt; align-items: start; break-inside: avoid; }
  .numbox { border: 1px solid #555; border-radius: 5pt; padding: 2pt 9pt 3pt; }
  .numbox h2 { margin-top: 4pt !important; }
  body.copy-style .numbox tr.grey td { background: #f2f2f2; } body.copy-style .numbox tr.white td { background: #fff; }
  .figs { display: grid; grid-template-columns: 1.5fr 1fr 0.9fr; gap: 8pt; align-items: start; margin-top: 12pt; break-inside: avoid; }
  .figs img { display: block; width: 100%; height: auto; border: 1px solid #ddd; }
  .figs .f4 { grid-column: 3; grid-row: 1 / span 2; }
  .figs .f3 { grid-column: 1 / span 2; grid-row: 2; }
  .signoff { width: fit-content; margin: 8pt 0 0 auto; border: 1px solid #333; padding: 3pt 10pt; text-align: center; font-style: italic; font-weight: 700; }
  @media screen { body { background: #ddd; padding: 20px; } .sheet { background: #fff; padding: 14mm; box-shadow: 0 2px 12px rgba(0,0,0,.2); } }
</style>
</head>
<body>
<div class="sheet">
  <div class="top"><span id="top-left">Ortho Study Hub</span><span id="top-right"></span></div>
  <div id="content"><p>Loading…</p></div>
  <div class="foot" id="foot"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="data/articles.js"></script>
<script src="data/topics.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const slug = q.get('slug');
  const doc = q.get('doc') || 'handout';
  const isTopic = q.get('kind') === 'topic';
  const style = q.get('style');
  if (style === 'sheet' || style === 'copy') document.body.classList.add('sheet-style');
  if (style === 'copy') document.body.classList.add('copy-style');
  const base = `${isTopic ? 'topics' : 'articles'}/${encodeURIComponent(slug)}/`;
  const a = isTopic ? null : (typeof ARTICLES !== 'undefined' ? ARTICLES : []).find(x => x.slug === slug);
  const t = isTopic ? (typeof TOPICS !== 'undefined' ? TOPICS : []).find(x => x.slug === slug) : null;
  const el = document.getElementById('content');
  document.getElementById('top-right').textContent = a ? `${a.authors} · ${a.journal} ${a.year}` : (t ? `Literature review · Topic ${t.n}` : (slug || ''));
  document.getElementById('top-left').textContent = `Ortho Study Hub · ${doc.replace(/-/g, ' ')}`;
  document.getElementById('foot').textContent = a ? `${a.citation} · ${slug}/${doc}.md` : (t ? `${t.name} · topics/${slug}/${doc}.md` : '');
  document.title = a ? `${a.short || slug} — ${doc}` : (t ? `${t.name} — ${doc}` : doc);
  try {
    const res = await fetch(`${base}${encodeURIComponent(doc)}.md`, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    el.innerHTML = marked.parse(md, { gfm: true });
    // Relative images live under articles/<slug>/; wrap captioned images in a figure.
    el.querySelectorAll('img').forEach(img => {
      const src = img.getAttribute('src') || '';
      if (src && !/^(https?:|data:|\/)/.test(src)) img.src = `${base}${src}`;
      const alt = img.getAttribute('alt');
      const p = img.parentElement;
      if (alt && p && p.tagName === 'P') {
        const f = document.createElement('figure');
        p.replaceWith(f);
        f.appendChild(img);
        const c = document.createElement('figcaption');
        c.textContent = alt;
        f.appendChild(c);
      }
    });
    await Promise.all([...el.querySelectorAll('img')].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
    document.body.setAttribute('data-ready', '1');
  } catch (e) {
    el.innerHTML = `<p class="error">Could not load ${slug}/${doc}.md (${e.message})</p>`;
  }
})();
</script>
</body>
</html>
