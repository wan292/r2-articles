<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0E1217" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<title>Ortho Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    try {
      var t = localStorage.getItem('orthoTheme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>Ortho Study Hub</h1>
      <p>Every article, ready for the room and the exam.</p>
    </div>
  </div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
    <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
    <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
  </button>
</header>

<nav class="nav-tabs" aria-label="Sections">
  <button class="nav-tab active" data-view="library">Library</button>
  <button class="nav-tab" data-view="review">Review</button>
  <button class="nav-tab" data-view="cards">Cards</button>
</nav>

<main id="app"></main>

<button class="to-top" id="to-top" type="button" aria-label="Back to top" hidden>↑</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="data/cards.js"></script>
<script src="data/articles.js"></script>
<script src="script.js"></script>
</body>
</html>
